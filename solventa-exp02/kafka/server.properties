# Broker Kafka de EXP-02 (KRaft, nodo unico: broker + controller).
#
# Plataforma de mensajeria de la vista de despliegue (VC-005): "Kafka con TLS".
# - Ningun listener en claro hacia la red: INTERNO (red-eventos) y EXTERNO (host,
#   127.0.0.1:5194) son SSL con TLS 1.3 y certificado de cliente obligatorio,
#   firmado por la CA del experimento.
# - CONTROLLER escucha solo en 127.0.0.1 dentro del contenedor (quorum de un nodo).
# Las claves del keystore NO estan aqui: se concatenan al arrancar desde
# secretos/kafka_ssl.properties (ver docker-compose.yml).

process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9093
controller.listener.names=CONTROLLER

listeners=INTERNO://0.0.0.0:9092,EXTERNO://0.0.0.0:9094,CONTROLLER://127.0.0.1:9093
advertised.listeners=INTERNO://kafka:9092,EXTERNO://localhost:5194
listener.security.protocol.map=INTERNO:SSL,EXTERNO:SSL,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNO

ssl.keystore.type=PKCS12
ssl.keystore.location=/certs/kafka.p12
ssl.truststore.type=PEM
ssl.truststore.location=/certs/ca.crt
ssl.client.auth=required
ssl.protocol=TLSv1.3
ssl.enabled.protocols=TLSv1.3
ssl.endpoint.identification.algorithm=https

# Los topicos los crea scripts/crear_topicos.py con su configuracion explicita.
auto.create.topics.enable=false
num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0

log.dirs=/tmp/kraft-logs
log.retention.hours=24
